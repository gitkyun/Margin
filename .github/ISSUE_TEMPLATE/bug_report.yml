name: 오류 보고
description: 문서·화면·동작의 재현 가능한 문제를 기록합니다.
title: "[Bug] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 발생한 문제
      description: 관련 문서 번호나 화면과 현재 동작을 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 재현 방법
      description: 어떤 입력과 행동에서 발생했는지 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대한 결과
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 환경·참고자료
      description: 브라우저·커밋·가상 예시 등을 적고 실제 개인 연구 자료는 제외해 주세요.
