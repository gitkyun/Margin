version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/home-preview
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      non-major:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
