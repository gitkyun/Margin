name: Checks and deployment

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/home-preview/package-lock.json
      - run: python3 scripts/check_repository.py
      - run: python3 scripts/check_git_hygiene.py
      - run: npm ci --ignore-scripts
        working-directory: apps/home-preview
      # 배포되는 의존성에 알려진 높은 위험도 취약점이 있으면 실패합니다.
      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high
        working-directory: apps/home-preview
      - run: npm run typecheck && npm test && npm run test:backend
        working-directory: apps/home-preview
      - run: npm run build
        working-directory: apps/home-preview
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - run: node scripts/prepare-sites-build.mjs && npm run test:sites
        working-directory: apps/home-preview
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name != 'pull_request'
        with:
          name: margin-web-${{ github.sha }}
          path: apps/home-preview/dist/client
          retention-days: 7
          if-no-files-found: error

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/home-preview/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: apps/home-preview
      - run: npx playwright install --with-deps chromium
        working-directory: apps/home-preview
      # 실제 서버와 계정을 쓰지 않습니다(미리보기 모드 + 가로챈 서버 응답).
      - run: npm run test:e2e
        working-directory: apps/home-preview
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report-${{ github.sha }}
          path: |
            apps/home-preview/playwright-report
            apps/home-preview/test-results
          retention-days: 7

  deploy:
    name: Deploy main
    needs: [checks, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: margin-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Verify build configuration and detect backend changes
        id: backend
        run: node scripts/deployment-preflight.mjs
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          BACKEND_BASELINE_COMMIT: ${{ vars.BACKEND_BASELINE_COMMIT }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        if: steps.backend.outputs.changed == 'true'
        with:
          version: 2.54.11
      - name: Apply migrations and deploy server functions
        if: steps.backend.outputs.changed == 'true'
        working-directory: apps/home-preview
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_ID"
          supabase db push --dry-run
          supabase db push --yes
          supabase functions deploy ai-assist --use-api
          supabase functions deploy delete-research --use-api
          supabase functions deploy project-invite --use-api
          supabase functions deploy review-notify --use-api
          supabase functions deploy file-copy-to-r2 --use-api
      - name: Install build dependencies
        run: npm ci --ignore-scripts
        working-directory: apps/home-preview
      - name: Build exact checked commit
        run: npm run build
        working-directory: apps/home-preview
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - name: Publish and verify Cloudflare Pages
        run: node scripts/deploy-pages.mjs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
