name: Repository checks

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository:
    name: Documents and repository structure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Check local document links and required files
        run: python3 scripts/check_repository.py
      - name: Check whitespace in the latest change
        shell: bash
        run: |
          if [ "$(git rev-list --count HEAD)" -gt 1 ]; then
            git diff --check HEAD^ HEAD
          fi
