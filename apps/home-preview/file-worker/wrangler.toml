# Margin file Worker. Deploy: npx wrangler deploy (from this folder).
# Secrets (never commit): npx wrangler secret put FILE_SERVICE_SECRET
name = "margin-files"
main = "index.js"
compatibility_date = "2026-11-01"
workers_dev = true

[[r2_buckets]]
binding = "FILES"
bucket_name = "margin-files"

