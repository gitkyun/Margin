project_id = "rms-classroom"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54322
major_version = 17
[auth]
enabled = true
site_url = "http://127.0.0.1:4175"
additional_redirect_urls = ["http://localhost:4175"]
enable_signup = false
minimum_password_length = 8
[auth.email]
# `enabled` is not a valid key in Supabase CLI 2.54.11 (the version CI pins);
# email sign-in is on by default. Keep this file parseable by that CLI.
enable_confirmations = true
[storage]
enabled = true
file_size_limit = "20MiB"
[functions.ai-assist]
# The function validates JWTs through auth.getUser, including asymmetric keys.
verify_jwt = false

[functions.delete-research]
# JWT and owner checks are performed inside the function.
verify_jwt = false
