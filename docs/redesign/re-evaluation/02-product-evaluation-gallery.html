<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MARGIN Phase 3 — 스크린샷 중심 10개 영역 종합 제품 평가 탐색기</title>
<style>
  :root {
    --bg: #f8f9fb;
    --surface: #ffffff;
    --surface-muted: #f1f3f6;
    --border: #e5e8ee;
    --text: #191f28;
    --text-sub: #4e5968;
    --text-mute: #8b95a1;
    --primary: #3182f6;
    --primary-soft: #e8f3ff;
    --green: #0ca678;
    --green-soft: #e6fcf5;
    --red: #e03131;
    --red-soft: #fff5f5;
    --amber: #d9480f;
    --amber-soft: #fff4e6;
    --purple: #6741d9;
    --purple-soft: #f3f0ff;
    --blue-soft: #edf2ff;
    --radius: 14px;
    --shadow: 0 2px 10px rgba(15, 23, 42, 0.04);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  .topbar {
    position: sticky;
    top: 0;
    z-index: 40;
    background: rgba(255, 255, 255, 0.94);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
  }
  .wrap {
    max-width: 1440px;
    margin: 0 auto;
    padding: 0 24px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 16px 0 12px;
    flex-wrap: wrap;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .brand-dot {
    width: 10px;
    height: 10px;
    border-radius: 999px;
    background: var(--primary);
  }
  h1 {
    font-size: 19px;
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.02em;
  }
  .subtitle {
    font-size: 13px;
    color: var(--text-sub);
    margin: 2px 0 0;
  }
  .search-box {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .search-input {
    width: 260px;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 13px;
    background: var(--surface);
    color: var(--text);
    outline: none;
  }
  .search-input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--primary-soft);
  }
  .toggle-18 {
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text-sub);
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .toggle-18.active {
    background: var(--text);
    color: #fff;
    border-color: var(--text);
  }
  .filter-bar {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 0 0 14px;
  }
  .pill-row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    align-items: center;
  }
  .pill {
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-sub);
    padding: 5px 11px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.12s ease;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .pill:hover { border-color: #cbd5e1; color: var(--text); }
  .pill.active {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
  }
  .pill .cnt {
    font-size: 11px;
    opacity: 0.8;
  }
  .stats-strip {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 10px;
    margin: 20px 0 18px;
  }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    cursor: pointer;
    transition: transform 0.12s ease, border-color 0.12s ease;
  }
  .stat-card:hover { transform: translateY(-1px); border-color: #cbd5e1; }
  .stat-card.active { border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary-soft); }
  .stat-label { font-size: 12px; font-weight: 600; color: var(--text-sub); }
  .stat-val { font-size: 22px; font-weight: 700; margin-top: 2px; letter-spacing: -0.02em; }
  .c-strength { color: var(--green); }
  .c-usability { color: var(--amber); }
  .c-defect { color: var(--red); }
  .c-taste { color: var(--purple); }
  .c-design { color: var(--primary); }

  .result-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    font-size: 13px;
    color: var(--text-sub);
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 18px;
    padding-bottom: 64px;
  }
  @media (max-width: 1180px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 760px) {
    .grid { grid-template-columns: 1fr; }
    .stats-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    cursor: pointer;
    transition: transform 0.14s ease, box-shadow 0.14s ease, border-color 0.14s ease;
  }
  .card:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 24px rgba(15, 23, 42, 0.08);
    border-color: #cbd5e1;
  }
  .thumb-wrap {
    position: relative;
    aspect-ratio: 16 / 10;
    background: var(--surface-muted);
    overflow: hidden;
    border-bottom: 1px solid var(--border);
  }
  .thumb-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top left;
    display: block;
  }
  .img-count {
    position: absolute;
    right: 10px;
    bottom: 10px;
    background: rgba(25, 31, 40, 0.78);
    color: #fff;
    font-size: 11px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 999px;
  }
  .card-body {
    padding: 14px 16px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex: 1;
  }
  .badges {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    align-items: center;
  }
  .badge {
    font-size: 11px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 6px;
    line-height: 1.3;
  }
  .b-strength { background: var(--green-soft); color: var(--green); }
  .b-usability { background: var(--amber-soft); color: var(--amber); }
  .b-defect { background: var(--red-soft); color: var(--red); }
  .b-taste { background: var(--purple-soft); color: var(--purple); }
  .b-design { background: var(--blue-soft); color: var(--primary); }
  .b-domain { background: var(--surface-muted); color: var(--text-sub); font-weight: 600; }
  .b-18 { background: #191f28; color: #fff; }
  .card-title {
    font-size: 15px;
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.015em;
    color: var(--text);
  }
  .card-desc {
    font-size: 13px;
    color: var(--text-sub);
    margin: 0;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .code-path {
    margin-top: auto;
    padding-top: 8px;
    border-top: 1px dashed var(--border);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11.5px;
    color: var(--text-mute);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Lightbox Modal */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(15, 23, 42, 0.72);
    backdrop-filter: blur(4px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: var(--surface);
    border-radius: 18px;
    width: 100%;
    max-width: 1360px;
    height: min(88vh, 860px);
    display: grid;
    grid-template-columns: 1.55fr 1fr;
    overflow: hidden;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.28);
  }
  @media (max-width: 980px) {
    .modal { grid-template-columns: 1fr; height: 92vh; overflow-y: auto; }
  }
  .modal-left {
    background: #0f172a;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .modal-img-stage {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: auto;
    padding: 16px;
  }
  .modal-img-stage img {
    max-width: 100%;
    max-height: 100%;
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  .modal-thumbs {
    display: flex;
    gap: 8px;
    padding: 10px 14px;
    background: #1e293b;
    overflow-x: auto;
    align-items: center;
  }
  .modal-thumb-btn {
    border: 2px solid transparent;
    border-radius: 6px;
    padding: 0;
    background: none;
    cursor: pointer;
    overflow: hidden;
    flex-shrink: 0;
    height: 48px;
    width: 76px;
  }
  .modal-thumb-btn.active { border-color: var(--primary); }
  .modal-thumb-btn img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .modal-img-caption {
    color: #cbd5e1;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11.5px;
    margin-left: auto;
    padding-left: 12px;
    white-space: nowrap;
  }
  .modal-right {
    padding: 22px 24px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .modal-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
  }
  .modal-close {
    border: 1px solid var(--border);
    background: var(--surface);
    border-radius: 8px;
    width: 32px;
    height: 32px;
    font-size: 16px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .modal-title { font-size: 19px; font-weight: 700; margin: 4px 0 0; letter-spacing: -0.02em; }
  .detail-box {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
  }
  .detail-label {
    font-size: 11.5px;
    font-weight: 700;
    color: var(--text-mute);
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .detail-text { font-size: 13.5px; color: var(--text); margin: 0; }
  .modal-nav {
    margin-top: auto;
    padding-top: 12px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    gap: 8px;
  }
  .nav-btn {
    padding: 8px 14px;
    border: 1px solid var(--border);
    background: var(--surface);
    border-radius: 8px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
  }
  .nav-btn:hover { background: var(--surface-muted); }
</style>
</head>

<header class="topbar">

let state = { domain: "전체", cat: "all", only18: false, q: "" };
let filtered = [...ITEMS];
let modalIdx = 0;
let modalImgIdx = 0;

function renderDomainPills() {
  const el = document.getElementById("domainPills");
  el.innerHTML = DOMAINS.map(d => {
    const count = d === "전체" ? ITEMS.length : ITEMS.filter(i => i.domain === d).length;
    return `<button type="button" class="pill ${state.domain === d ? "active" : ""}" data-domain="${d}">${d} <span class="cnt">${count}</span></button>`;
  }).join("");
  el.querySelectorAll(".pill").forEach(btn => {
    btn.addEventListener("click", () => {
      state.domain = btn.dataset.domain;
      renderAll();
    });
  });
}

function renderStats() {
  const base = ITEMS.filter(i => (state.domain === "전체" || i.domain === state.domain) && (!state.only18 || i.issue18));
  const cats = ["strength", "usability", "defect", "taste", "design"];
  const el = document.getElementById("statsStrip");
  el.innerHTML = cats.map(c => {
    const cnt = base.filter(i => i.cat === c).length;
    const m = CAT_META[c];
    return `<div class="stat-card ${state.cat === c ? "active" : ""}" data-cat="${c}">
      <div class="stat-label">${m.label}</div>
      <div class="stat-val ${m.color}">${cnt}</div>
    </div>`;
  }).join("");
  el.querySelectorAll(".stat-card").forEach(card => {
    card.addEventListener("click", () => {
      state.cat = state.cat === card.dataset.cat ? "all" : card.dataset.cat;
      renderAll();
    });
  });
}

function applyFilter() {
  const q = state.q.trim().toLowerCase();
  filtered = ITEMS.filter(i => {
    if (state.domain !== "전체" && i.domain !== state.domain) return false;
    if (state.cat !== "all" && i.cat !== state.cat) return false;
    if (state.only18 && !i.issue18) return false;
    if (q) {
      const hay = `${i.id} ${i.domain} ${i.title} ${i.context} ${i.rationale} ${i.code} ${i.issue18 || ""}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

function renderGrid() {
  applyFilter();
  document.getElementById("resultCount").textContent = `표시 중: ${filtered.length}개 / 전체 ${ITEMS.length}개 평가 카드`;
  const grid = document.getElementById("cardGrid");
  if (!filtered.length) {
    grid.innerHTML = `<div style="grid-column:1/-1;padding:48px;text-align:center;color:var(--text-mute);background:#fff;border:1px solid var(--border);border-radius:14px;">조건에 맞는 평가 항목이 없습니다. 필터를 초기화해 보세요.</div>`;
    return;
  }
  grid.innerHTML = filtered.map((item, idx) => {
    const cm = CAT_META[item.cat];
    return `<article class="card" data-idx="${idx}">
      <div class="thumb-wrap">
        <img src="${item.images[0]}" alt="${item.title}" loading="lazy" />
        ${item.images.length > 1 ? `<span class="img-count">스크린샷 ${item.images.length}장</span>` : ""}
      </div>
      <div class="card-body">
        <div class="badges">
          <span class="badge ${cm.badge}">${cm.label}</span>
          <span class="badge b-domain">${item.domain}</span>
          ${item.issue18 ? `<span class="badge b-18">문제의식 ${item.issue18}</span>` : ""}
        </div>
        <h3 class="card-title">${item.id} · ${item.title}</h3>
        <p class="card-desc">${item.rationale}</p>
        <div class="code-path">${item.code}</div>
      </div>
    </article>`;
  }).join("");
  grid.querySelectorAll(".card").forEach(card => {
    card.addEventListener("click", () => openModal(Number(card.dataset.idx)));
  });
}

function openModal(idx) {
  modalIdx = idx;
  modalImgIdx = 0;
  renderModal();
  document.getElementById("modalBackdrop").classList.add("open");
}

function renderModal() {
  const item = filtered[modalIdx];
  if (!item) return;
  const cm = CAT_META[item.cat];
  document.getElementById("modalBadges").innerHTML = `
    <span class="badge ${cm.badge}">${cm.label}</span>
    <span class="badge b-domain">${item.domain}</span>
    ${item.issue18 ? `<span class="badge b-18">디자이너 문제의식 ${item.issue18}</span>` : ""}
  `;
  document.getElementById("modalTitle").textContent = `${item.id} · ${item.title}`;
  document.getElementById("modalContext").textContent = item.context;
  document.getElementById("modalRationale").textContent = item.rationale;
  document.getElementById("modalCode").textContent = item.code;

  const imgSrc = item.images[modalImgIdx] || item.images[0];
  const mainImg = document.getElementById("modalMainImg");
  mainImg.src = imgSrc;
  mainImg.alt = item.title;

  const thumbs = document.getElementById("modalThumbs");
  thumbs.innerHTML = item.images.map((src, i) => `
    <button type="button" class="modal-thumb-btn ${i === modalImgIdx ? "active" : ""}" data-i="${i}">
      <img src="${src}" alt="" />
    </button>
  `).join("") + `<span class="modal-img-caption">${imgSrc}</span>`;
  thumbs.querySelectorAll(".modal-thumb-btn").forEach(b => {
    b.addEventListener("click", () => {
      modalImgIdx = Number(b.dataset.i);
      renderModal();
    });
  });

  document.getElementById("prevBtn").disabled = modalIdx <= 0;
  document.getElementById("nextBtn").disabled = modalIdx >= filtered.length - 1;
}

function closeModal() {
  document.getElementById("modalBackdrop").classList.remove("open");
}

function renderAll() {
  renderDomainPills();
  renderStats();
  renderGrid();
}

document.getElementById("searchInput").addEventListener("input", e => {
  state.q = e.target.value;
  renderGrid();
});
document.getElementById("toggle18").addEventListener("click", e => {
  state.only18 = !state.only18;
  e.currentTarget.classList.toggle("active", state.only18);
  renderAll();
});
document.getElementById("modalClose").addEventListener("click", closeModal);
document.getElementById("modalBackdrop").addEventListener("click", e => {
  if (e.target.id === "modalBackdrop") closeModal();
});
document.getElementById("prevBtn").addEventListener("click", () => {
  if (modalIdx > 0) { modalIdx--; modalImgIdx = 0; renderModal(); }
});
document.getElementById("nextBtn").addEventListener("click", () => {
  if (modalIdx < filtered.length - 1) { modalIdx++; modalImgIdx = 0; renderModal(); }
});
document.addEventListener("keydown", e => {
  const open = document.getElementById("modalBackdrop").classList.contains("open");
  if (!open) return;
  if (e.key === "Escape") closeModal();
  if (e.key === "ArrowLeft" && modalIdx > 0) { modalIdx--; modalImgIdx = 0; renderModal(); }
  if (e.key === "ArrowRight" && modalIdx < filtered.length - 1) { modalIdx++; modalImgIdx = 0; renderModal(); }
});

renderAll();
</script>
</body>
</html>
