<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Phase 5 전후 비교</title>
<style>
  :root {
    --bg: #f4f5f7; --surface: #fff; --sunken: #f7f7f8; --line: #e1e2e4; --line-strong: #c2c4c8;
    --text: #171719; --sub: #46474c; --mute: #686b73;
    --brand: #0066ff; --brand-soft: #eaf2fe; --danger: #d61f1f; --danger-soft: #feecec;
    --ok: #00843d; --ok-soft: #e6f8ee; --warn: #a35a00; --warn-soft: #fff4e5; --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111214; --surface: #1b1c1e; --sunken: #212225; --line: #2e2f33; --line-strong: #46474c;
      --text: #f4f4f5; --sub: #c2c4c8; --mute: #9a9ca3; --brand: #5c9dff; --brand-soft: #14233d;
      --danger: #ff6b6b; --danger-soft: #3a1a1a; --ok: #3fd07f; --ok-soft: #12301f; --warn: #ffb347; --warn-soft: #3a2a12; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.55 "Pretendard", -apple-system, "Apple SD Gothic Neo", sans-serif; }
  button.btn { border: 1px solid var(--line-strong); background: var(--surface); color: var(--text); border-radius: 8px; padding: 7px 12px; font: inherit; font-size: 13px; cursor: pointer; min-height: 34px; }
  button.btn.primary { background: #0066ff; border-color: #0066ff; color: #fff; }
  button.btn:disabled { opacity: 0.45; cursor: not-allowed; }
  :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  .proposal { display: inline-block; font-size: 11.5px; padding: 2px 8px; border-radius: 6px; background: var(--warn-soft); color: var(--warn); font-weight: 600; }
  .confirmed { display: inline-block; font-size: 11.5px; padding: 2px 8px; border-radius: 6px; background: var(--brand-soft); color: var(--brand); font-weight: 600; }
  .badge { display: inline-block; font-size: 11.5px; padding: 2px 8px; border-radius: 6px; background: var(--sunken); color: var(--sub); border: 1px solid var(--line); font-weight: 600; }

  header.topbar {
    position: sticky; top: 0; z-index: 20;
    background: var(--surface); border-bottom: 1px solid var(--line);
    padding: 12px 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px;
  }
  .brand-block { display: flex; align-items: baseline; gap: 8px; margin-right: auto; }
  header.topbar h1 { margin: 0; font-size: 18px; }
  .count-pill { font-size: 12.5px; color: var(--mute); font-weight: 600; }

  .filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .filters label { font-size: 12px; color: var(--mute); display: inline-flex; align-items: center; gap: 5px; }
  .filters select, .filters input[type="search"], .mobile-picker select {
    border: 1px solid var(--line-strong); background: var(--surface); color: var(--text);
    border-radius: 8px; padding: 6px 10px; font: inherit; font-size: 13px; min-height: 34px; max-width: 100%;
  }
  .filters input[type="search"] { width: 190px; }

  .mobile-picker { display: none; padding: 10px 14px; background: var(--surface); border-bottom: 1px solid var(--line); }
  .mobile-picker label { display: block; font-size: 12px; color: var(--mute); margin-bottom: 4px; }
  .mobile-picker select { width: 100%; }

  .layout {
    display: grid; grid-template-columns: 264px minmax(0, 1fr);
    min-height: calc(100vh - 60px);
  }
  aside.sidebar {
    background: var(--surface); border-right: 1px solid var(--line);
    padding: 12px 10px 32px; overflow-y: auto; max-height: calc(100vh - 60px); position: sticky; top: 60px;
  }
  .area-group { margin-bottom: 12px; }
  .area-title {
    font-size: 11.5px; font-weight: 700; color: var(--mute);
    padding: 6px 10px 4px; letter-spacing: 0.01em;
  }
  .nav-item {
    display: flex; align-items: center; justify-content: space-between; gap: 6px;
    width: 100%; text-align: left; border: 1px solid transparent; background: transparent;
    color: var(--sub); border-radius: 8px; padding: 7px 10px; font: inherit; font-size: 13px;
    cursor: pointer; min-height: 34px;
  }
  .nav-item:hover { background: var(--sunken); color: var(--text); }
  .nav-item[aria-current="true"] {
    background: var(--brand-soft); color: var(--brand); border-color: var(--brand); font-weight: 700;
  }
  .nav-item-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nav-dot { width: 6px; height: 6px; border-radius: 999px; flex: none; background: var(--brand); opacity: 0.7; }

  main.stage { padding: 18px 20px 40px; min-width: 0; }
  .item-head {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 14px 16px; margin-bottom: 14px;
  }
  .item-title-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .item-title-row h2 { margin: 0; font-size: 18px; }
  .item-meta { margin-top: 6px; font-size: 12.5px; color: var(--sub); display: flex; flex-wrap: wrap; gap: 6px 14px; }
  .item-meta code { font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: var(--mute); }

  .compare-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; align-items: start; }
  .pane {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 14px 16px; min-width: 0;
  }
  .pane-head {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid var(--line);
  }
  .pane-head h3 { margin: 0; font-size: 14.5px; }
  .pane-link { font-size: 12.5px; color: var(--brand); text-decoration: none; font-weight: 600; }
  .pane-link:hover { text-decoration: underline; }

  .img-link { display: block; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); background: var(--sunken); }
  .img-link img { display: block; max-width: 100%; height: auto; margin: 0 auto; }
  .proto-frame {
    display: block; width: 100%; height: 720px; border: 1px solid var(--line);
    border-radius: 8px; background: var(--bg);
  }
  .empty-box {
    border: 1px dashed var(--line-strong); border-radius: 10px; background: var(--sunken);
    color: var(--mute); padding: 28px 16px; text-align: center; font-size: 13.5px;
  }
  .desc-text { margin: 12px 0 0; font-size: 14px; color: var(--text); line-height: 1.6; }

  .pager {
    margin-top: 16px; padding: 12px 16px; background: var(--surface);
    border: 1px solid var(--line); border-radius: var(--radius);
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .pager-pos { font-size: 13.5px; font-weight: 700; color: var(--sub); }

  .empty-state {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 40px 20px; text-align: center; color: var(--mute); font-size: 14.5px;
  }

  @media (max-width: 960px) {
    .layout { grid-template-columns: 1fr; }
    aside.sidebar { display: none; }
    .mobile-picker { display: block; }
    .compare-grid { grid-template-columns: 1fr; }
    .proto-frame { height: 560px; }
    main.stage { padding: 14px 12px 32px; }
    .filters { width: 100%; }
    .filters input[type="search"] { flex: 1; min-width: 140px; width: auto; }
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand-block">
    <h1>Phase 5 전후 비교</h1>
    <span class="count-pill" id="total-count">항목 0개</span>
  </div>
  <div class="filters" role="search" aria-label="항목 필터와 검색">
    <label>쟁점
      <select id="f-issue" aria-label="쟁점 필터">
        <option value="all">전체</option>
        <option value="1">쟁점 1</option>
        <option value="2">쟁점 2</option>
        <option value="3">쟁점 3</option>
        <option value="4">쟁점 4</option>
        <option value="5">쟁점 5</option>
        <option value="6">쟁점 6</option>
        <option value="7">쟁점 7</option>
        <option value="8">쟁점 8</option>
        <option value="none">쟁점 없음</option>
      </select>
    </label>
    <label>판정
      <select id="f-verdict" aria-label="판정 필터">
        <option value="all">전체</option>
        <option value="보완">보완</option>
        <option value="통합">통합</option>
        <option value="제거">제거</option>
        <option value="재설계">재설계</option>
        <option value="추가">추가</option>
      </select>
    </label>
    <label>상태
      <select id="f-status" aria-label="상태 필터">
        <option value="all">전체</option>
        <option value="확정">확정</option>
        <option value="제안">제안</option>
        <option value="확정+제안">확정+제안</option>
      </select>
    </label>
    <input type="search" id="f-query" placeholder="제목·설명·문제 ID 검색" aria-label="항목 검색" />
  </div>
</header>

<div class="mobile-picker">
  <label for="mobile-select">항목 고르기</label>
  <select id="mobile-select" aria-label="항목 선택"></select>
</div>

<div class="layout">
  <aside class="sidebar" id="sidebar" aria-label="비교 항목 목록"></aside>
  <main class="stage" id="stage"></main>
</div>

<script src="compare-items.js"></script>
<script>
(function () {
  var ALL = Array.isArray(window.COMPARE_ITEMS) ? window.COMPARE_ITEMS : [];
  var fIssue = document.getElementById('f-issue');
  var fVerdict = document.getElementById('f-verdict');
  var fStatus = document.getElementById('f-status');
  var fQuery = document.getElementById('f-query');
  var totalCount = document.getElementById('total-count');
  var sidebar = document.getElementById('sidebar');
  var mobileSelect = document.getElementById('mobile-select');
  var stage = document.getElementById('stage');

  var filtered = ALL.slice();
  var currentId = null;

  function esc(str) {
    return String(str == null ? '' : str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function applyFilter(preserveHashId) {
    var iv = fIssue.value;
    var vv = fVerdict.value;
    var sv = fStatus.value;
    var q = fQuery.value.trim().toLowerCase();

    filtered = ALL.filter(function (it) {
      if (iv === 'none') {
        if (it.issue && it.issue.length > 0) return false;
      } else if (iv !== 'all') {
        var num = Number(iv);
        if (!it.issue || it.issue.indexOf(num) === -1) return false;
      }
      if (vv !== 'all' && String(it.verdict || '').indexOf(vv) === -1) return false;
      if (sv !== 'all' && it.status !== sv) return false;
      if (q) {
        var hay = [it.id, it.screenId, it.title, it.area, it.beforeText, it.afterText, (it.problemIds || []).join(' ')].join(' ').toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });

    totalCount.textContent = filtered.length === ALL.length
      ? '항목 ' + ALL.length + '개'
      : '항목 ' + filtered.length + ' / ' + ALL.length + '개';

    var wanted = preserveHashId || currentId;
    var found = filtered.find(function (x) { return x.id === wanted; });
    currentId = found ? found.id : (filtered[0] ? filtered[0].id : null);

    renderList();
    renderStage(false);
  }

  function renderList() {
    var groups = [];
    var byArea = {};
    filtered.forEach(function (it) {
      if (!byArea[it.area]) {
        byArea[it.area] = [];
        groups.push(it.area);
      }
      byArea[it.area].push(it);
    });

    if (filtered.length === 0) {
      sidebar.innerHTML = '<div style="padding:16px 10px;color:var(--mute);font-size:13px;">조건에 맞는 항목이 없어요.</div>';
      mobileSelect.innerHTML = '<option value="">조건에 맞는 항목이 없어요.</option>';
      mobileSelect.disabled = true;
      return;
    }

    mobileSelect.disabled = false;
    sidebar.innerHTML = groups.map(function (area) {
      return '<div class="area-group">' +
        '<div class="area-title">' + esc(area) + ' (' + byArea[area].length + ')</div>' +
        byArea[area].map(function (it) {
          var isCur = it.id === currentId;
          var dot = it.afterProto ? '<span class="nav-dot" title="시안 연결됨" aria-hidden="true"></span>' : '';
          return '<button type="button" class="nav-item" data-id="' + esc(it.id) + '"' + (isCur ? ' aria-current="true"' : '') + '>' +
            '<span class="nav-item-text">' + esc(it.title) + '</span>' + dot +
          '</button>';
        }).join('') +
      '</div>';
    }).join('');

    mobileSelect.innerHTML = groups.map(function (area) {
      return '<optgroup label="' + esc(area) + '">' +
        byArea[area].map(function (it) {
          return '<option value="' + esc(it.id) + '"' + (it.id === currentId ? ' selected' : '') + '>' +
            esc(it.id + ' · ' + it.title) + (it.afterProto ? ' [시안]' : '') +
          '</option>';
        }).join('') +
      '</optgroup>';
    }).join('');

    sidebar.querySelectorAll('.nav-item').forEach(function (btn) {
      btn.addEventListener('click', function () { selectItem(btn.dataset.id, true); });
    });
  }

  function selectItem(id, updateHash) {
    if (!filtered.some(function (x) { return x.id === id; })) return;
    currentId = id;
    if (updateHash) {
      history.replaceState(null, '', '#' + id);
    }
    sidebar.querySelectorAll('.nav-item').forEach(function (btn) {
      if (btn.dataset.id === id) {
        btn.setAttribute('aria-current', 'true');
      } else {
        btn.removeAttribute('aria-current');
      }
    });
    if (mobileSelect.value !== id) mobileSelect.value = id;
    renderStage(false);
  }

  function splitProposal(s) {
    // '제안:' 앞은 확정, 뒤는 사용자가 정하지 않은 제안이에요.
    var i = String(s).indexOf('제안:');
    if (i <= 0) return esc(s);
    return esc(s.slice(0, i)) + '<br><span class="proposal">제안</span> ' + esc(s.slice(i + 3).trim());
  }

  function renderStage(updateHash) {
    if (!currentId || filtered.length === 0) {
      stage.innerHTML = '<div class="empty-state">조건에 맞는 항목이 없어요.</div>';
      return;
    }
    var idx = filtered.findIndex(function (x) { return x.id === currentId; });
    var it = filtered[idx];
    if (updateHash) {
      history.replaceState(null, '', '#' + it.id);
    }

    var statusBadge = it.status === '제안'
      ? '<span class="proposal">제안</span>'
      : it.status === '확정+제안'
        ? '<span class="confirmed">확정</span> <span class="proposal">일부 제안</span>'
        : '<span class="confirmed">확정</span>';
    var issueBadge = (it.issue && it.issue.length > 0)
      ? '<span class="badge">쟁점 ' + esc(it.issue.join('·')) + '</span>'
      : '';
    var probLine = (it.problemIds && it.problemIds.length > 0)
      ? '문제 ID: ' + esc(it.problemIds.join(' · '))
      : '문제 ID: 없음';

    var beforeHtml;
    if (it.beforeImage) {
      var imgUrl = '../../' + it.beforeImage;
      beforeHtml =
        '<a class="img-link" href="' + esc(imgUrl) + '" target="_blank" rel="noopener">' +
          '<img src="' + esc(imgUrl) + '" alt="' + esc('지금 화면: ' + it.title) + '" />' +
        '</a>' +
        '<p class="desc-text">' + esc(it.beforeText) + '</p>';
    } else {
      beforeHtml =
        '<div class="empty-box">지금 화면 캡처가 없어요.</div>' +
        '<p class="desc-text">' + esc(it.beforeText) + '</p>';
    }

    var afterHtml;
    var afterHeadLink = '';
    if (it.afterProto) {
      var protoUrl = '../prototypes/' + it.afterProto;
      afterHeadLink = '<a class="pane-link" href="' + esc(protoUrl) + '" target="_blank" rel="noopener">시안 새 창에서 열기 ↗</a>';
      afterHtml =
        '<iframe class="proto-frame" src="' + esc(protoUrl) + '" title="' + esc('바뀐 뒤 시안: ' + it.title) + '"></iframe>' +
        '<p class="desc-text">' + splitProposal(it.afterText) + '</p>';
    } else {
      afterHtml =
        '<div class="empty-box">이 항목은 시안 없이 설명만 있어요.</div>' +
        '<p class="desc-text">' + splitProposal(it.afterText) + '</p>';
    }

    stage.innerHTML =
      '<div class="item-head">' +
        '<div class="item-title-row">' +
          '<h2>' + esc(it.title) + '</h2>' +
          '<span class="badge">' + esc(it.verdict) + '</span>' +
          statusBadge +
          issueBadge +
        '</div>' +
        '<div class="item-meta">' +
          '<span><code>' + esc(it.id) + '</code> · <code>' + esc(it.screenId) + '</code> · ' + esc(it.area) + '</span>' +
          '<span>' + probLine + '</span>' +
        '</div>' +
      '</div>' +
      '<div class="compare-grid">' +
        '<section class="pane" aria-label="지금 화면">' +
          '<div class="pane-head"><h3>지금</h3>' + (it.beforeImage ? '<a class="pane-link" href="' + esc('../../' + it.beforeImage) + '" target="_blank" rel="noopener">원본 크게 보기 ↗</a>' : '') + '</div>' +
          beforeHtml +
        '</section>' +
        '<section class="pane" aria-label="바뀐 뒤">' +
          '<div class="pane-head"><h3>바뀐 뒤</h3>' + afterHeadLink + '</div>' +
          afterHtml +
        '</section>' +
      '</div>' +
      '<nav class="pager" aria-label="항목 이동">' +
        '<button type="button" class="btn" id="btn-prev"' + (idx <= 0 ? ' disabled' : '') + '>← 이전</button>' +
        '<span class="pager-pos">' + (idx + 1) + ' / ' + filtered.length + '</span>' +
        '<button type="button" class="btn" id="btn-next"' + (idx >= filtered.length - 1 ? ' disabled' : '') + '>다음 →</button>' +
      '</nav>';

    document.getElementById('btn-prev').addEventListener('click', function () { step(-1); });
    document.getElementById('btn-next').addEventListener('click', function () { step(1); });
  }

  function step(delta) {
    if (filtered.length === 0) return;
    var idx = filtered.findIndex(function (x) { return x.id === currentId; });
    var nextIdx = idx + delta;
    if (nextIdx < 0 || nextIdx >= filtered.length) return;
    selectItem(filtered[nextIdx].id, true);
  }

  [fIssue, fVerdict, fStatus].forEach(function (el) {
    el.addEventListener('change', function () { applyFilter(null); });
  });
  fQuery.addEventListener('input', function () { applyFilter(null); });
  mobileSelect.addEventListener('change', function () { selectItem(mobileSelect.value, true); });

  document.addEventListener('keydown', function (e) {
    var tag = e.target && e.target.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (e.target && e.target.isContentEditable)) return;
    if (e.key === 'ArrowLeft') { e.preventDefault(); step(-1); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); step(1); }
  });

  window.addEventListener('hashchange', function () {
    var hid = location.hash.slice(1);
    if (hid) selectItem(hid, false);
  });

  var initHash = location.hash.slice(1);
  applyFilter(initHash || null);
  if (currentId && !initHash) {
    history.replaceState(null, '', '#' + currentId);
  }
})();
</script>
</body>
</html>
